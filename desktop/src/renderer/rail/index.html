<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"
    />
    <title>侧栏</title>
    <link rel="stylesheet" href="rail.css" />
  </head>
  <body class="rail-overlay">
    <div id="wallpaper" aria-hidden="true">
      <div class="wall-layer" data-slot="a"></div>
    </div>

    <div id="app">
      <nav id="rail" aria-label="主导航">
        <div id="rail-head">
          <img id="rail-mark" src="../../assets/icon-32.png" alt="" draggable="false" />
          <button id="rail-pin" type="button" title="固定侧栏（常驻展开）" aria-label="固定侧栏" aria-pressed="false"></button>
        </div>
        <div id="rail-top"></div>
        <form id="rail-jump" autocomplete="off">
          <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>
          <input id="rail-jump-input" type="text" maxlength="12" placeholder="题号跳转" spellcheck="false" aria-label="按题号跳转" />
        </form>
        <div id="rail-bottom"></div>
        <button id="rail-user" type="button" aria-label="账户">
          <span class="rail-user-avatar" aria-hidden="true">洛</span>
          <span class="rail-user-text">
            <span class="rail-user-name">未登录</span>
            <span class="rail-user-sub">点击登录</span>
          </span>
        </button>
      </nav>
    </div>

    <script type="module" src="rail.js"></script>
  </body>
</html>
