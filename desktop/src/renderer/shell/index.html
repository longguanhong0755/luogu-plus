<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: https:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self' data:"
    />
    <title>洛谷桌面版</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <div id="wallpaper" aria-hidden="true">
      <div class="wall-layer" data-slot="a"></div>
      <div class="wall-layer" data-slot="b"></div>
    </div>

    <div id="app">
      <header id="titlebar">
        <img class="tb-mark" src="../../assets/icon-32.png" alt="" draggable="false" />
        <span id="tb-title">主页</span>
        <span class="tb-drag" aria-hidden="true"></span>
        <button id="tb-jump" class="tb-action" type="button" title="搜索题号（Ctrl+L）" aria-label="搜索题号"></button>
        <button id="tb-avatar" type="button" title="个人主页" aria-label="个人主页">洛</button>
      </header>

      <nav id="rail" aria-label="主导航">
        <div id="rail-head">
          <button id="rail-pin" class="rail-btn rail-pin" type="button" title="展开侧栏" aria-label="展开侧栏" aria-pressed="false">
            <span class="rail-label">展开侧栏</span>
          </button>
        </div>
        <div id="rail-top"></div>
        <div id="rail-bottom"></div>
        <button id="rail-users" class="rail-btn" type="button" title="用户搜索（Ctrl+U）" aria-label="用户搜索">
          <span class="rail-label">用户搜索</span>
        </button>
      </nav>


      <main id="content">
        <section id="home" class="page"></section>
        <section id="library" class="page" hidden></section>

        <section id="browse" hidden>
          <div id="toolbar"></div>
          <div id="workspace">
            <div id="view-host"></div>
            <div id="ide-resizer" hidden aria-hidden="true"></div>
            <aside id="ide-pane" hidden></aside>
          </div>
        </section>
      </main>

      <div id="overlay" hidden>
        <div id="scrim"></div>

        <div id="palette" class="overlay-card" role="dialog" aria-modal="true" aria-label="命令面板" tabindex="-1" hidden>
          <div class="pal-head">
            <span class="pal-icon"></span>
            <input
              id="pal-input"
              type="text"
              placeholder="输入题号、题名或功能…"
              autocomplete="off"
              spellcheck="false"
              aria-label="搜索题号、题名或功能"
              role="combobox"
              aria-controls="pal-list"
              aria-expanded="true"
            />
            <span class="pal-esc">Esc</span>
          </div>
          <div id="pal-list" class="pal-list" role="listbox" aria-label="搜索结果"></div>
          <div id="jump-options" class="jump-options" hidden>
            <label>难度
              <select id="jump-difficulty">
                <option value="1">入门</option>
                <option value="2">普及−</option>
                <option value="3">普及</option>
                <option value="4">普及+/提高−</option>
                <option value="5">提高</option>
                <option value="6">提高+/省选−</option>
                <option value="7">省选/NOI−</option>
                <option value="8">NOI/NOI+/CTS</option>
              </select>
            </label>
            <label>题库
              <select id="jump-source">
                <option value="P">洛谷题库</option>
                <option value="CF">Codeforces</option>
                <option value="SP">SPOJ</option>
                <option value="AT">AtCoder</option>
                <option value="UVA">UVa</option>
              </select>
            </label>
            <div class="jump-actions">
              <span id="jump-status" role="status">可随机跳题</span>
              <button id="jump-random" type="button">按条件随机</button>
              <button id="jump-true-random" type="button" class="secondary">真·随机</button>
            </div>
          </div>
          <div class="pal-foot"><span>↑↓ 选择</span><span>↵ 打开</span><span>Esc 关闭</span></div>
        </div>

        <div id="switcher" class="overlay-card" role="dialog" aria-modal="true" aria-label="页面切换器" tabindex="-1" hidden>
          <div class="sw-head">打开的页面</div>
          <div id="sw-list" class="sw-list" role="listbox" aria-label="打开的页面"></div>
          <div class="sw-foot">↑↓ 选择 · ↵ 切换 · Esc 关闭</div>
        </div>

        <div id="user-search" class="overlay-card" role="dialog" aria-modal="true" aria-label="用户搜索" tabindex="-1" hidden>
          <form id="user-search-form" class="pal-head">
            <span class="pal-icon"></span>
            <input id="user-search-input" type="search" placeholder="输入用户名或 UID…" autocomplete="off" spellcheck="false" aria-label="搜索洛谷用户" />
            <button id="user-search-submit" type="submit" class="jump-submit">搜索</button>
            <span class="pal-esc">Esc</span>
          </form>
          <div id="user-search-list" class="user-search-list" role="listbox" aria-label="用户搜索结果"></div>
          <div class="pal-foot"><span>Enter 搜索</span><span>点击结果打开个人主页</span><span>Esc 关闭</span></div>
        </div>
      </div>

      <div id="toasts" aria-live="polite" aria-atomic="false"></div>
    </div>

    <script type="module" src="shell.js"></script>
  </body>
</html>
