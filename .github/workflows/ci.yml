name: CI

# 两道门禁：
#   desktop —— 新应用静态检查 + 不可见冒烟启动（截图作为 artifact）
#   legacy  —— 归档旧版的 9 项静态检查（防止归档后腐化）
# 两者都跑在 windows-latest，与本地环境一致。

# 自动门禁已按 owner 要求关闭（2026-11-14）：push / pull_request 不再自动触发。
# GitHub 的 windows-latest 跑冒烟不稳定（3 次连续红在同一「冒烟启动」步骤），
# 质量门禁改为本地 `npm run check` + `npm run smoke`。需要在 CI 上验证时手动触发本工作流。
# 想恢复自动跑，把下面的 workflow_dispatch 换回 push / pull_request 触发即可。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop 应用
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 静态检查（语法 / 资源 / IPC 双向对齐）
        run: npm run check

      - name: 冒烟启动（不可见，截图）
        env:
          LG_SMOKE_OUT: ${{ runner.temp }}/smoke-home.png
        run: npm run smoke

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/smoke-*.png
          if-no-files-found: ignore

  legacy:
    name: Legacy 静态检查
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: legacy
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy/package-lock.json

      - name: 安装静态检查依赖（不下载 Electron）
        run: npm ci --ignore-scripts

      - name: 旧版 9 项静态检查
        env:
          LG_EOL_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash scripts/check-all.sh
