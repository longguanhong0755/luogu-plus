<!DOCTYPE html>
<html lang="zh-CN" data-lg-shell="1">
<head>
  <meta charset="UTF-8" />
  <title>Luogu++</title>
  <!-- 材质唯一文件：面的配方、壁纸层公式、别名全在这里（与页面侧注入的是同一份） -->
  <link rel="stylesheet" href="lgasset://local/material.css" />
  <link rel="stylesheet" href="lgasset://local/chrome/chrome.css" />
</head>
<body>
  <!-- 壁纸层：唯一公式（material.css 的 .lg-wallpaper）。静态图走 CSS 变量，
       视频用层内的 <video> 播——两层在同一个滤镜/视差变换里，几何与观感一致。 -->
  <div id="wall" class="lg-wallpaper"><video id="bg-video" muted loop playsinline preload="auto"></video></div>

  <!-- 垂直标签栏（Edge 式）：仅垂直模式显示 -->
  <aside id="vtab">
    <div id="vtab-head">
      <!-- 唯一的下拉箭头：点开「标签页操作」菜单（与原右侧那颗同名同效） -->
      <button class="icon-btn" id="btn-vcollapse" title="标签页操作"></button>
      <button class="icon-btn" id="btn-vpin" title="钉住侧栏（不自动收回）"></button>
    </div>
    <!-- 钉住标签（Zen Essentials）：图标网格，不占标签列表 -->
    <div id="vtab-pins"></div>
    <div id="vtabs"></div>
    <button id="vtab-new" title="新建标签页 (Ctrl+T)"><span class="plus">+</span><span class="vtxt">新建标签页</span></button>
    <button id="vtab-set" title="Luogu++ 设置 (F2)"></button>
    <!-- 右缘拖宽手柄（Edge 能拖宽窄）：只在常驻展开时可用 -->
    <div id="vtab-resize" title="拖动调整侧栏宽度"></div>
  </aside>
  <!-- 紧凑模式（Zen Compact）的左缘热区：侧栏收没时悬停这里浮出侧栏。
       不能带 hidden：UA 的 [hidden] 规则会压住 body.compact 的 display:block -->
  <div id="compact-edge"></div>

  <!-- 顶栏：标签条（水平模式）+ 标题行（垂直模式）+ 浏览器式工具行 -->
  <header id="top">
    <div id="tabstrip">
      <button class="icon-btn" id="tabs-more" title="标签页操作"></button>
      <div id="tabs"></div>
      <button id="tab-new" title="新建标签页 (Ctrl+T)">+</button>
      <div id="strip-pad"></div>
    </div>
    <!-- 垂直模式的标题行（Edge 式）：当前标签图标 + 网页描述，居中；
         右侧是窗口三键（#wctl 绝对定位在右上角）。水平模式整行不显示。 -->
    <div id="titlerow">
      <div id="vtab-current"><span class="vc-icon"></span><span class="vc-title"></span></div>
    </div>
    <div id="navrow">
      <div id="histbtns">
        <button class="icon-btn" id="btn-back" title="后退 (Alt+←)">
          <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
        </button>
        <button class="icon-btn" id="btn-fwd" title="前进 (Alt+→)">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
        <button class="icon-btn" id="btn-reload" title="刷新 (Ctrl+R / F5)">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <!-- 加载中刷新键换成停止键（浏览器语义） -->
        <button class="icon-btn" id="btn-stop" title="停止加载" hidden>
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="omnibox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input id="omni-input" type="text" spellcheck="false" autocomplete="off"
               placeholder="网址 / 题号 / UID / 搜索词" />
      </div>
      <div id="actions">
        <button class="icon-btn" id="btn-downloads" title="下载" hidden></button>
        <a id="user-chip" href="#"><span class="uname anon">未登录</span><span class="caret"></span></a>
      </div>
    </div>
    <div id="loadbar"></div>
    <!-- 缩放比例提示（R36）：窗口右上角、窗口三键左侧；标签上不再写比例。
         变化时高亮浮出约 1.5 秒，之后 ≠100% 留淡色常驻（chrome.js zoomHudSync） -->
    <div id="zoomhud"></div>
    <!-- 窗口控制按钮自绘：系统的 titleBarOverlay 会压住账号芯片。
         用户要求"放在最右上角"——所以它绝对定位在顶栏右上角，不属于任何一行，
         水平模式占标签条那 34px，垂直模式占工具行那 44px。 -->
    <div id="wctl">
      <button class="wbtn" id="w-min" title="最小化"></button>
      <button class="wbtn" id="w-max" title="最大化 / 还原"></button>
      <button class="wbtn wclose" id="w-close" title="关闭"></button>
    </div>
  </header>

  <!-- 账号下拉 -->
  <div id="account-menu" hidden>
    <div class="am-head">账号</div>
    <div id="am-list"></div>
    <div class="am-sep"></div>
    <button class="am-item am-manage" id="am-manage">管理账号…</button>
  </div>

  <!-- 下载面板 -->
  <div id="download-menu" hidden>
    <div class="am-head">下载</div>
    <div id="dl-list"></div>
    <div class="am-sep"></div>
    <button class="am-item am-manage" id="dl-clear">清除已完成的记录</button>
  </div>

  <!-- 标签页操作菜单（Edge 式：布局切换 / 整理标签页 / 折叠 / 设置） -->
  <div id="tabmore-menu" hidden></div>

  <!-- 标签分组面板（Edge 式：组名 / 10 色 / 组中新建 / 取消分组 / 关闭分组） -->
  <div id="group-menu" hidden></div>

  <!-- 命令面板（Ctrl+Shift+P）与页内查找条（Ctrl+F）的实体在覆盖层
       （src/popup/）：外壳层永远压在网页视图下面，画在这里会被网页盖住。 -->

  <!-- 坞的渲染源（R36：坞显示在独立覆盖视图 src/dock/，页面内容从它底下穿过、
       不再让位）。外壳层永远压在网页视图底下，坞要浮在页面之上只能走覆盖
       视图；这里只留一个隐形的节点：renderDock 把 innerHTML + 整套主题变量
       推给主进程，转发给坞视图显示 -->
  <aside id="dock"></aside>


  <!-- 分屏分割条池：嵌在页面视图之间的 6px 缝里（那里没有任何视图覆盖，
       外壳能直接收到鼠标事件）。条数随布局变（1~3 根），几何由主进程
       chrome:split 推下来，外壳按需创建/隐藏 .sb-bar。 -->
  <div id="splitbars"></div>

  <script src="lgasset://local/icons.js"></script>
  <script src="lgasset://local/chrome/chrome.js"></script>
</body>
</html>
